# Banco do CRONA: Postgres 17 no Docker, só para este computador.
#   npm run banco          sobe (e deixa ligado: volta sozinho com o Docker)
#   npm run banco:parar    desliga
#   npm run banco:backup   cópia em server/data/backups/
# A porta fica presa a 127.0.0.1: o tablet e os outros aparelhos da rede não
# enxergam o banco (eles falam só com o servidor do CRONA).
#
# Até 03/10/2026 o jogo se chamava CROMA, e o banco ficava no container croma-postgres
# (volume croma_croma-dados). Na troca de nome, os dados foram copiados para este banco
# novo; o antigo ficou desligado, inteiro, como cópia de segurança (não apague).
name: crona
services:
  banco:
    image: postgres:17-alpine
    container_name: crona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crona
      POSTGRES_PASSWORD: ${CRONA_DB_SENHA:-crona_local}
      POSTGRES_DB: crona
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${CRONA_DB_PORTA:-5433}:5432"
    volumes:
      - crona-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crona -d crona"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  crona-dados:
