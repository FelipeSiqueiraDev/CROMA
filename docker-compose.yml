# Banco do CROMA: Postgres 17 no Docker, só para este computador.
#   npm run banco          sobe (e deixa ligado: volta sozinho com o Docker)
#   npm run banco:parar    desliga
#   npm run banco:backup   cópia em server/data/backups/
# A porta fica presa a 127.0.0.1: o tablet e os outros aparelhos da rede não
# enxergam o banco (eles falam só com o servidor do CROMA).
name: croma
services:
  banco:
    image: postgres:17-alpine
    container_name: croma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: croma
      POSTGRES_PASSWORD: ${CROMA_DB_SENHA:-croma_local}
      POSTGRES_DB: croma
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${CROMA_DB_PORTA:-5433}:5432"
    volumes:
      - croma-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U croma -d croma"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  croma-dados:
